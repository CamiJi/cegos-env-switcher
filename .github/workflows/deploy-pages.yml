name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Prepare extension signing key
        env:
          CHROME_EXTENSION_PRIVATE_KEY: ${{ secrets.CHROME_EXTENSION_PRIVATE_KEY }}
        run: |
          if [ -z "$CHROME_EXTENSION_PRIVATE_KEY" ]; then
            echo "Missing secret: CHROME_EXTENSION_PRIVATE_KEY" >&2
            exit 1
          fi
          mkdir -p /tmp/cegos-extension-key
          printf '%s' "$CHROME_EXTENSION_PRIVATE_KEY" > /tmp/cegos-extension-key/extension.pem
          chmod 600 /tmp/cegos-extension-key/extension.pem

      - name: Package extension
        env:
          CHROME_EXTENSION_KEY_PATH: /tmp/cegos-extension-key/extension.pem
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: bash scripts/package-extension.sh

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp -R site/. dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
